---
name: Requirements Validation

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  validate-requirements:
    name: Validate Requirements Schema
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate requirements
        uses: ./.github/actions/validate-requirements
        with:
          schema-path: documents/tools/requirement.schema.json
          requirements-dir: documents/requirements
          sources-dir: .

      - name: Validate example requirements
        uses: ./.github/actions/validate-requirements
        with:
          schema-path: documents/tools/requirement.schema.json
          requirements-dir: examples
          sources-dir: examples

  requirements-pdf:
    name: Generate Requirements PDF
    runs-on: ubuntu-latest
    # Pandoc, the XeLaTeX tool chain and PyYAML come with the container image.
    container: gabrielfrasantos/embedded-devcontainer-documentation:v7.4.0@sha256:0537b16931e116f98fd62e0bad454af5bcd102ec6501ccdef2b270aa83fd281e
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate PDF
        timeout-minutes: 15
        uses: ./.github/actions/generate-requirements-pdf
        with:
          requirements-dir: documents/requirements
          template-path: documents/templates/requirements.md
          output-path: documents/output/requirements.pdf

      - name: Upload PDF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: requirements-pdf
          path: documents/output/requirements.pdf
