name: Generate Requirements PDF
description: >-
  Generates a PDF document from YAML requirement files. Requires Python 3 with
  PyYAML, Pandoc and XeLaTeX, e.g. by running the job in the
  embedded-devcontainer-documentation container image.

inputs:
  requirements-dir:
    description: Directory containing YAML requirement files
    required: true
  template-path:
    description: Path to the markdown template
    required: true
  output-path:
    description: Output PDF file path
    required: true

runs:
  using: composite
  steps:
    - name: Generate PDF
      shell: bash
      run: |
        python3 ${{ github.action_path }}/generate.py \
          --requirements-dir "${{ inputs.requirements-dir }}" \
          --template "${{ inputs.template-path }}" \
          --output "${{ inputs.output-path }}"
