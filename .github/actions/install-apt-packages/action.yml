name: Install apt packages
description: Installs Ubuntu packages without recommended packages, reusing the downloaded .deb files across runs

inputs:
  packages:
    description: Space-separated package names
    required: true
  cache-name:
    description: Name that keeps this package set's download cache apart from others
    required: true

runs:
  using: composite
  steps:
    - name: Name the download cache
      id: cache-key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        CACHE_NAME: ${{ inputs.cache-name }}
      run: |
        prefix="apt-${CACHE_NAME}-${ImageOS:-${RUNNER_OS}}-$(echo "${PACKAGES}" | sha256sum | cut -c1-12)-"
        echo "prefix=${prefix}" >> "${GITHUB_OUTPUT}"
        echo "key=${prefix}$(date -u +%G-%V)" >> "${GITHUB_OUTPUT}"

    - name: Restore downloaded packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/apt-archives
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: ${{ steps.cache-key.outputs.prefix }}

    - name: Install packages
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        ARCHIVES: ${{ runner.temp }}/apt-archives
      run: |
        mkdir -p "${ARCHIVES}/partial"
        apt_options=(
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
          -o DPkg::Lock::Timeout=120
          -o Dir::Cache::Archives="${ARCHIVES}"
          -o APT::Keep-Downloaded-Packages=true
        )
        read -ra package_list <<< "${PACKAGES}"
        sudo apt-get "${apt_options[@]}" update
        sudo DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install -y --no-install-recommends "${package_list[@]}"
        sudo apt-get "${apt_options[@]}" autoclean
        sudo chown -R "$(id -u):$(id -g)" "${ARCHIVES}"
